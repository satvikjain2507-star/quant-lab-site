:root{
  --bg:#080b12; --panel:#0e131d; --raise:#151b28; --line:#222a3a; --line2:#344059;
  --text:#f4f6fb; --sec:#b1bacb; --mut:#7b879f;
  --up:#35d691; --down:#ff6b6b; --up-soft:rgba(53,214,145,.13); --down-soft:rgba(255,107,107,.13);
  --acc:#3987e5; --acc-soft:rgba(57,135,229,.16);
  --wide:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--wide);font-stretch:100%;
  font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;
  padding-top:max(10px,env(safe-area-inset-top));background:rgba(8,11,18,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-stretch:118%;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{display:block}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:7px;font-weight:600;color:var(--sec);white-space:nowrap}
.seg button[aria-selected=true]{background:var(--text);color:var(--bg)}
.all{margin-left:auto;text-align:right;line-height:1.25}
.all .k{font-size:12px;color:var(--mut)}
.all .v{font-weight:700;font-stretch:112%;font-size:15px}
.all .v span{font-weight:600;font-size:13px;margin-left:6px}

/* ticker tape */

    `<div style="margin-top:14px"><button class="btn ghost" id="yreset">Start over with new picks</button></div></div></div>`;
  $("yreset").onclick = () => { store.set("my-" + m.key, null); youPage(); };
}

/* ---------- how it works ---------- */
function research(){
  const R = D.research, n = D.markets.reduce((t, m) => t + m.accounts.length, 0);
  const steps = [["Collect", "Daily prices for the Nifty 500, the S&P 500 and 24 global funds, going back 20 years."], ["Clean", "Splits, demergers, bad ticks and unfinished trading days are repaired before anything is tested."],
    ["Learn", "Machine-learning models score every stock from 17 signals. They are retrained each month on past data only."], ["Decide", "On the last trading day of the month each strategy picks its portfolio using that day's closing prices."],
    ["Trade", "Orders fill at the next morning's open and pay brokerage, STT, stamp duty, GST and slippage."], ["Publish", "Every portfolio's ledger is rebuilt into this page and published automatically, every week."]];
  let html = `<div class="ph"><h1>How Quant Lab works</h1><p>A public, live test of one question: can AI really beat the stock market? ${n} portfolios run side by side with paper money, pay real costs, and are scored against simply holding everything.</p></div>` +
    `<div class="g3">${steps.map((s, i) => `<div class="panel step"><div class="no">${i + 1}</div><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join("")}</div>` + appCard();
  if (R) {
    const top = Math.max(...R.india.map(r => r[1]));
    html += `<div class="g2" style="margin-top:16px"><div class="panel pad"><div class="h3">₹10 lakh invested in ${R.period.split(" to ")[0]}, after all costs (log scale)</div><div id="rchart"></div>` +
      `<div class="key">${R.curve.s.map(c => `<span><i style="background:${COL[c[1]]}"></i>${esc(c[0])}</span>`).join("")}</div></div>` +
      `<div class="panel pad"><div class="h3">20 years on India's Nifty 500: growth per year and worst fall</div>` +
      R.india.map(r => `<div class="hb"><span>${esc(r[0])}</span><div class="bar"><i style="width:${100 * r[1] / top}%;background:${COL[r[3]]}"></i></div><b class="num">${r[1].toFixed(1)}%</b><em class="num down">${String(r[2]).replace("-", "−")}%</em></div>`).join("") +
      `<p class="mini">Backtest, ${esc(R.period)}, trading costs included. A backtest is a rehearsal, not a result: see the next panel.</p></div></div>` +
      `<div class="g2" style="margin-top:16px"><div class="panel pad"><div class="h3">The bias we caught in our own test: US edge over Equal weight, % a year</div>` +
      `<div class="gb">${R.bias.labels.map((_, i) => { const a = R.bias.biased[i], b = R.bias.honest[i], k = 170 / Math.max(...R.bias.biased);
        return `<div><i style="height:${a * k}px;background:#4a5670"><span>${a.toFixed(1)}</span></i><i class="${b < 0 ? "neg" : ""}" style="height:${Math.abs(b) * k}px;background:var(--up)"><span>${b.toFixed(1).replace("-", "−")}</span></i></div>`; }).join("")}</div>` +
      `<div class="gbl">${R.bias.labels.map(l => `<span>${esc(l)}</span>`).join("")}</div>` +
      `<div class="key"><span><i style="background:#4a5670"></i>Tested on today's index list (flattering)</span><span><i style="background:var(--up)"></i>Stocks allowed only after they joined the index (honest)</span></div>` +
      `<p class="mini">Testing on today's S&P 500 list quietly "knows" which companies went on to succeed. Remove that hindsight and most of the edge disappears. What survived is small, and that is the honest number.</p></div>` +
      `<div class="panel pad"><div class="h3">The rules that keep it honest</div><ul class="rules">` +
      `<li><b>A fair yardstick.</b> Every model is compared with Equal weight in the same market, not with a flattering index.</li>` +
      `<li><b>Real costs.</b> Every order pays what a real investor would pay.</li>` +
      `<li><b>No peeking.</b> Decisions use today's close; trades happen at tomorrow's open.</li>` +
      `<li><b>Luck test.</b> Each edge is re-tested on 2,000 reshuffled histories.</li>` +
      `<li><b>Forward proof.</b> The live portfolios on this site are the real exam. Their history is never edited.</li></ul></div></div>`;
  }
  html += `<p class="mini" style="margin-top:16px;max-width:90ch">Quant Lab is a research and learning project. Nothing here is investment advice, and past results, real or simulated, do not predict future returns.</p>`;
  $("pg-research").innerHTML = html;
  if (R) rchart(R);
}
function rchart(R){
  const box = $("rchart"), W = Math.max(300, box.clientWidth), H = W < 520 ? 230 : 290, L = 6, Rr = 56, T = 10, B = 24, d = R.curve.d;
  const all = R.curve.s.flatMap(c => c[2]), lo = Math.log10(Math.min(...all) * 0.85), hi = Math.log10(Math.max(...all) * 1.25);
  const X = i => L + i / (d.length - 1) * (W - L - Rr), Y = v => H - B - (Math.log10(v) - lo) / (hi - lo) * (H - T - B);
  let g = "";
  [10, 30, 100, 300].filter(v => Math.log10(v) > lo && Math.log10(v) < hi).forEach(v => { g += `<line x1="${L}" x2="${W - Rr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#1b2231"/><text x="${W - Rr + 8}" y="${(Y(v) + 4).toFixed(1)}" font-size="11.5" fill="#7b879f">₹${v >= 100 ? v / 100 + " Cr" : v + " L"}</text>`; });
  d.forEach((x, i) => { if (x.slice(5, 7) === "01" && +x.slice(0, 4) % 4 === 2) g += `<text x="${X(i).toFixed(1)}" y="${H - 6}" font-size="11.5" fill="#7b879f" text-anchor="middle">${x.slice(0, 4)}</text>`; });
  R.curve.s.slice().reverse().forEach(c => { g += `<polyline points="${c[2].map((v, i) => X(i).toFixed(1) + "," + Y(v).toFixed(1)).join(" ")}" fill="none" stroke="${COL[c[1]]}" stroke-width="${c[1] === "smart" ? 2.6 : 1.7}" stroke-linejoin="round" ${c[1] === "index" ? 'stroke-dasharray="5 5"' : ""}/>`; });
  const sm = R.curve.s[0][2], e = sm[sm.length - 1];
  g += `<circle cx="${X(d.length - 1).toFixed(1)}" cy="${Y(e).toFixed(1)}" r="4.5" fill="${COL.smart}" stroke="#0e131d" stroke-width="2"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto" role="img" aria-label="Growth of ten lakh rupees since 2006 for the Smart model, ML half speed, Equal weight and the Nifty 50. The table beside it gives the yearly figures.">${g}</svg>`;
}
